[api]
schemas = ["public", "fss"]

[functions.fss-pay-vendor]
# The function performs its own constant-time secret check. Calls are only
# forwarded by the loopback-only Vite development proxy, which keeps the
# development access token out of the browser bundle.
verify_jwt = false

[functions.fss-send-email]
enabled = true
verify_jwt = false
import_map = "./functions/fss-send-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/fss-send-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/fss-send-email/*.html" ]
